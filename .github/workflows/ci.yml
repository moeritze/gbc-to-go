name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax check
        run: |
          find web scripts -type f \( -name '*.js' -o -name '*.mjs' \) -not -path 'web/vendor/*' \
            | while read -r f; do node --check "$f" || exit 1; done
      - name: Forbidden files guard
        run: |
          bad=$(git ls-files | grep -E '(\.(gb|gbc|sav)$|(^|/)(deploy\.env|\.firebaserc|\.env\.test\.local)$|^web/firebase-config\.js$)' || true)
          if [ -n "$bad" ]; then echo "Forbidden files tracked:"; echo "$bad"; exit 1; fi
      - name: Firebase SDK pin matches package.json
        run: |
          want=$(node -p "require('./package.json').devDependencies.firebase")
          found=$(grep -o 'firebasejs/[0-9][^/]*' web/firebase.js | sort -u | sed 's|firebasejs/||')
          [ -n "$found" ] || { echo "no gstatic firebasejs URLs found"; exit 1; }
          if [ "$found" != "$want" ]; then echo "web/firebase.js uses [$found], package.json wants $want"; exit 1; fi
